name: Builds

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux"
        type: boolean
        default: true
      build_android:
        description: "Build Android"
        type: boolean
        default: true

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-macos
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        shell: python
        run: |
          import json, os

          matrix = {"include": []}

          if "${{ inputs.build_windows }}" == "true":
              matrix["include"].extend([
                  {"identifier": "windows-debug", "os": "windows-latest", "name": "\U0001f3c1 Windows Debug", "target": "template_debug", "platform": "windows", "arch": "x86_64"},
                  {"identifier": "windows-release", "os": "windows-latest", "name": "\U0001f3c1 Windows Release", "target": "template_release", "platform": "windows", "arch": "x86_64"},
              ])

          if "${{ inputs.build_macos }}" == "true":
              matrix["include"].extend([
                  {"identifier": "macos-debug", "os": "macos-latest", "name": "\U0001f34e macOS (universal) Debug", "target": "template_debug", "platform": "macos", "arch": "universal"},
                  {"identifier": "macos-release", "os": "macos-latest", "name": "\U0001f34e macOS (universal) Release", "target": "template_release", "platform": "macos", "arch": "universal"},
              ])

          if "${{ inputs.build_linux }}" == "true":
              matrix["include"].extend([
                  {"identifier": "linux-debug", "os": "ubuntu-22.04", "name": "\U0001f427 Linux Debug", "runner": "self-hosted", "target": "template_debug", "platform": "linux", "arch": "x86_64"},
                  {"identifier": "linux-release", "os": "ubuntu-22.04", "name": "\U0001f427 Linux Release", "runner": "self-hosted", "target": "template_release", "platform": "linux", "arch": "x86_64"},
                  {"identifier": "linux-arm64-debug", "os": "ubuntu-22.04", "name": "\U0001f427 Linux ARM64 Debug", "target": "template_debug", "platform": "linux", "arch": "arm64"},
                  {"identifier": "linux-arm64-release", "os": "ubuntu-22.04", "name": "\U0001f427 Linux ARM64 Release", "target": "template_release", "platform": "linux", "arch": "arm64"},
                  {"identifier": "linux-rv64-debug", "os": "ubuntu-22.04", "name": "\U0001f427 Linux RISC-V 64-bit Debug", "target": "template_debug", "platform": "linux", "arch": "rv64"},
                  {"identifier": "linux-rv64-release", "os": "ubuntu-22.04", "name": "\U0001f427 Linux RISC-V 64-bit Release", "target": "template_release", "platform": "linux", "arch": "rv64"},
              ])

          if "${{ inputs.build_android }}" == "true":
              matrix["include"].extend([
                  {"identifier": "android-debug", "os": "ubuntu-22.04", "name": "\U0001f916 Android Debug", "target": "template_debug", "platform": "android", "arch": "arm64"},
                  {"identifier": "android-release", "os": "ubuntu-22.04", "name": "\U0001f916 Android Release", "target": "template_release", "platform": "android", "arch": "arm64"},
              ])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  build:
    needs: setup
    runs-on: ${{matrix.os}}
    name: ${{matrix.name}}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Set up SCons
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons==4.5.2
          scons --version

      - name: Linux dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqq build-essential pkg-config

      - name: Set up Linux ARM64/RISC-V cross compiler
        if: ${{ matrix.platform == 'linux' && (matrix.arch == 'arm64' || matrix.arch == 'rv64') }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -qqq g++-aarch64-linux-gnu
          else
            sudo apt-get install -qqq g++-riscv64-linux-gnu
          fi

      - name: Setup MinGW for Windows/MinGW build
        if: ${{ matrix.platform == 'windows' }}
        uses: msys2/setup-msys2@v2

      - name: Set up Android NDK
        if: ${{ matrix.platform == 'android' }}
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;23.2.8568313"

      - name: Identify SCons cache inputs
        id: cache-identity
        shell: bash
        run: |
          case "${{ matrix.platform }}:${{ matrix.arch }}" in
            linux:x86_64) compiler_version="$(g++ -dumpfullversion -dumpversion)" ;;
            linux:arm64) compiler_version="$(aarch64-linux-gnu-g++ -dumpfullversion -dumpversion)" ;;
            linux:rv64) compiler_version="$(riscv64-linux-gnu-g++ -dumpfullversion -dumpversion)" ;;
            windows:x86_64) compiler_version="$(g++ -dumpfullversion -dumpversion)" ;;
            macos:universal) compiler_version="$(clang++ -dumpfullversion -dumpversion)-xcode-$(xcodebuild -version | awk '/Xcode/ {print $2}')" ;;
            android:arm64) compiler_version="ndk-23.2.8568313" ;;
            *) echo "Unsupported build target" >&2; exit 1 ;;
          esac

          compiler_version="$(printf '%s' "$compiler_version" | tr -cs '[:alnum:]._-' '-')"
          echo "compiler=$compiler_version" >> "$GITHUB_OUTPUT"
          echo "godot_cpp=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons build artifacts
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: scons-${{ runner.os }}-${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-4.5.2-${{ steps.cache-identity.outputs.compiler }}-godotcpp-${{ steps.cache-identity.outputs.godot_cpp }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-4.5.2-${{ steps.cache-identity.outputs.compiler }}-godotcpp-${{ steps.cache-identity.outputs.godot_cpp }}-

      - name: Compile godot-cpp
        if: ${{ matrix.platform != 'linux' || (matrix.arch != 'arm64' && matrix.arch != 'rv64') }}
        shell: sh
        run: |
          scons target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}'
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        working-directory: godot-cpp

      - name: Compile Extension
        shell: sh
        run: |
          scons target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}'
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache

      - name: Delete compilation files
        if: ${{ matrix.platform == 'windows' }}
        run: |
          Remove-Item game/addons/godot_midi/bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.identifier }}
          path: |
            ${{ github.workspace }}/game/addons/*
