name: GdUnit4 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gdunit-tests:
    name: Linux MIDI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons==4.5.2

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Identify build cache inputs
        id: cache-identity
        run: |
          echo "gcc=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          echo "godot_cpp=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons build artifacts
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: scons-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.cache-identity.outputs.gcc }}-scons-4.5.2-linux-x86_64-template_debug-${{ steps.cache-identity.outputs.godot_cpp }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.cache-identity.outputs.gcc }}-scons-4.5.2-linux-x86_64-template_debug-${{ steps.cache-identity.outputs.godot_cpp }}-

      - name: Build godot-cpp
        run: scons target=template_debug platform=linux arch=x86_64
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        working-directory: godot-cpp

      - name: Build GDExtension
        run: scons target=template_debug platform=linux arch=x86_64
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache

      - name: Run GdUnit4 tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.7.1"
          version: "v6.2.0"
          paths: "res://tests"
          project_dir: "./game/"
          publish-report: false
